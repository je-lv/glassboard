# Host firewall for the board VM: LAN-only. Checked by scripts/deploy-check.sh (nft -c).
# Adjust LAN to your subnet. Load with: sudo nft -f deploy/nftables-lan-only.conf
define LAN = 192.168.1.0/24
table inet glassboard {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ip saddr $LAN tcp dport { 22, 8443 } accept     # ssh for the admin, the board over TLS
    # Plain-HTTP mode instead: ip saddr $LAN tcp dport { 22, 8080 } accept
    ip saddr $LAN icmp type echo-request accept
  }
}
# TLS mode: the app listens on 127.0.0.1:8080 only and is never reachable from the network directly.
